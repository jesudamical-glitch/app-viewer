<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>osu!mania 4K Web Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 360px;
            height: 100vh;
            background-color: #121820;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border-left: 2px solid #21262d;
            border-right: 2px solid #21262d;
        }

        /* HUD - Puntuación e Info */
        #hud {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            z-index: 10;
        }

        #score {
            font-size: 28px;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 2px;
        }

        #accuracy {
            font-size: 14px;
            color: #8b949e;
        }

        #kps {
            font-size: 14px;
            color: #ff66aa;
            font-weight: bold;
            margin-top: 4px;
        }

        /* Carriles (Lanes) */
        #playfield {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .lane {
            flex: 1;
            height: 100%;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            /* SE ELIMINÓ TODO TIPO DE LUZ O CAMBIO DE COLOR DE FONDO */
            background-color: transparent !important;
        }

        .lane:last-child {
            border-right: none;
        }

        /* Receptores de Teclas (Key Position Indicators) */
        #key-container {
            display: flex;
            width: 100%;
            height: 90px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            position: absolute;
            bottom: 0;
            z-index: 5;
        }

        .key-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .key-circle {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.05s ease;
            background-color: rgba(18, 24, 32, 0.6);
        }

        /* Colores estándar osu!mania 4K */
        .lane-0 .key-circle { border-color: #3498db; color: #3498db; }
        .lane-1 .key-circle { border-color: #e74c3c; color: #e74c3c; }
        .lane-2 .key-circle { border-color: #e74c3c; color: #e74c3c; }
        .lane-3 .key-circle { border-color: #3498db; color: #3498db; }

        /* Efecto de pulsado SOLO en la tecla/círculo (sin iluminar la columna) */
        .key-circle.pressed {
            transform: scale(0.88);
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Menú de Pausa */
        #pause-menu {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        #pause-menu h2 {
            font-size: 32px;
            color: #ff66aa;
            margin-bottom: 10px;
        }

        .btn {
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #21262d;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #ff66aa;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- HUD -->
        <div id="hud">
            <div id="score">0000000</div>
            <div id="accuracy">100.00%</div>
            <div id="kps">0 KPS</div>
        </div>

        <!-- Playfield sin luces de fondo -->
        <div id="playfield">
            <div class="lane lane-0"></div>
            <div class="lane lane-1"></div>
            <div class="lane lane-2"></div>
            <div class="lane lane-3"></div>
        </div>

        <!-- Controles inferiores (A, S, K, L) -->
        <div id="key-container">
            <div class="key-wrapper lane-0"><div class="key-circle" id="key-0">A</div></div>
            <div class="key-wrapper lane-1"><div class="key-circle" id="key-1">S</div></div>
            <div class="key-wrapper lane-2"><div class="key-circle" id="key-2">K</div></div>
            <div class="key-wrapper lane-3"><div class="key-circle" id="key-3">L</div></div>
        </div>

        <!-- Menú de Pausa -->
        <div id="pause-menu">
            <h2>PAUSA</h2>
            <button class="btn" onclick="togglePause()">Continuar (ESC)</button>
        </div>
    </div>

    <script>
        const keyMap = {
            'a': 0, 'A': 0,
            's': 1, 'S': 1,
            'k': 2, 'K': 2,
            'l': 3, 'L': 3
        };

        let isPaused = false;

        // Mapeo de teclas para eventos de presionar
        window.addEventListener('keydown', (e) => {
            // FIX 1: ÚNICAMENTE la tecla ESCAPE maneja la pausa (se eliminó la 'P')
            if (e.key === 'Escape') {
                togglePause();
                return;
            }

            if (isPaused) return;

            if (keyMap[e.key] !== undefined) {
                const laneIndex = keyMap[e.key];
                const keyCircle = document.getElementById(`key-${laneIndex}`);
                if (keyCircle) {
                    keyCircle.classList.add('pressed');
                }
            }
        });

        // Mapeo de teclas para eventos de soltar
        window.addEventListener('keyup', (e) => {
            if (keyMap[e.key] !== undefined) {
                const laneIndex = keyMap[e.key];
                const keyCircle = document.getElementById(`key-${laneIndex}`);
                if (keyCircle) {
                    keyCircle.classList.remove('pressed');
                }
            }
        });

        // Función de Pausa
        function togglePause() {
            isPaused = !isPaused;
            const pauseMenu = document.getElementById('pause-menu');
            pauseMenu.style.display = isPaused ? 'flex' : 'none';
        }
    </script>
</body>
</html>
